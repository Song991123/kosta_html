<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            background-color: pink;
            height: 600px;
            display: flex;
            /* flex-direction: row-reverse; */
            flex-flow: row wrap;
            justify-content: flex-end;
            /* flex-start: 아이템들을 컨테이너의 시작 부분에 정렬 (기본값) */
            /* flex-end: 아이템들을 컨테이너의 끝 부분에 정렬 */
            /* center: 아이템들을 컨테이너의 중앙에 정렬 */
            /* space-between: 아이템들 사이에 동일한 간격을 두고 정렬 */
            /* space-around: 아이템들 주위에 동일한 간격을 두고 정렬 */
        }
        
        .main .item {
            width: 50px;
            height: 50px;
            border: 1px solid red;
            /* box-sizing은 요소의 크기를 계산할 때 padding과 border를 포함할지 여부를 결정 */
            /* border-box를 사용하면 width와 height에 padding과 border가 포함됨 */
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item item3">3</div>
        <div class="item item4">4</div>
        <div class="item item5">5</div>
        <div class="item item6">6</div>
        <div class="item item7">7</div>
        <div class="item item8">8</div>
        <div class="item item9">9</div>
        <div class="item item10">10</div>
    </div>
</body>

</html>
