<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         :root {
            font-size: 12px;
        }
        
        * {
            font-family: "myFont", sans-serif;
        }
        
        body,
        html {
            height: 100%;
            width: 100%;
        }
        
        .outer {
            width: 50vw;
            height: 50vh;
            background-color: lightskyblue;
            font-size: 25px;
        }
        
        .a {
            background-color: red;
            font-size: 12px;
        }
        
        .b {
            background-color: green;
            font-size: 0.5em;
        }
        
        .c {
            background-color: yellow;
            font-size: 1rem;
        }
        /* 글꼴 선언 */
        
        @font-face {
            font-family: "myFont";
            src: url("font/NotoSansKR-VariableFont_wght.ttf") format("truetype");
        }
    </style>
</head>

<body>
    <ul>
        <li>루트 요소의 폰트 크기는 12px로 설정되어 있음</li>
        <li>body와 html 요소는 화면 전체를 차지하도록 설정되어 있음</li>
        <li>rem 단위는 루트 요소의 폰트 크기를 기준으로 하기 때문에 1rem은 12px과 같음</li>
        <li>em 단위는 부모 요소의 폰트 크기를 기준으로 하기 때문에 .b 요소의 폰트 크기는 .outer 요소의 폰트 크기의 0.5배인 12.5px이 됨</li>
    </ul><br>
    <div class="outer">
        <div class="a">px : 절대 단위, 고정된 크기</div>
        <div class="b">em : 상대 단위, 부모 요소의 폰트 크기를 기준</div>
        <div class="c">rem : 상대 단위, 루트 요소(html)의 폰트 크기를 기준</div>
    </div>

</body>

</html>
