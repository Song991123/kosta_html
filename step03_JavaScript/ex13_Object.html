<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
	</head>
	<body>
		<h1>Object key와 value</h1>
	</body>
	<script>
		const obj = {
			name: "홍길동",
			age: 30,
			city: "서울",
			print: function () {
				console.log(`${this.name}은 ${this.age}살이고, ${this.city}에 살고 있습니다.`);
			},
		};
		console.log(obj); // {name: '홍길동', age: 30, city: '서울', print: ƒ}
		console.log(obj.name); // '홍길동'
		console.log(obj["age"]); // 30
		obj.print(); // '홍길동은 30살이고, 서울에 살고 있습니다.'

		console.log(Object.keys(obj)); // ['name', 'age', 'city', 'print']
		console.log(Object.values(obj)); // ['홍길동', 30, '서울', ƒ]

		// Object key와 value를 한 쌍으로 조회
		// of는 배열이나 문자열과 같은 반복 가능한 객체에서 요소를 하나씩 꺼내는 반복문 (iterable 객체의 value를 순회)
		// ㄴ iterable : 반복 가능한 객체 (배열, 문자열, Map, Set 등)
		// in은 객체의 속성 이름을 하나씩 꺼내는 반복문 (객체의 key를 순회)
		for (let key of Object.keys(obj)) {
			console.log(`${key}: ${obj[key]}`);
		}
	</script>
</html>
